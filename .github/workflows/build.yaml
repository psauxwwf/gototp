name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        default: "main"

jobs:
  build:
    name: Task build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Insall system dependences
        run: sudo apt-get install -y binutils mingw-w64 zip

      - name: Set up Task
        uses: go-task/setup-task@v2.2.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build project
        run: |
          task build zip

      - name: Set tag name
        run: echo "GITHUB_RELEASE_TAG=$(date +v%m.%d.%H)" >> $GITHUB_ENV

      - name: Publish Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.GITHUB_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./bin/${{ github.event.repository.name }}_linux_amd64.tar.gz
            ./bin/${{ github.event.repository.name }}_windows_amd64.tar.gz
